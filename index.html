<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Eag download</title>
  <style>
    :root { --bg:#0b1220; --card:#0f1724; --accent:#08a0ff; --text:#e6eef6; }
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;background:linear-gradient(180deg,#071127 0%,#071722 100%);color:var(--text)}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px}
    .card{background:var(--card);border-radius:16px;padding:40px 48px;text-align:center;box-shadow:0 8px 30px rgba(2,6,23,0.6);max-width:720px;width:100%}
    h1{margin:0 0 12px;font-size:24px}
    p{margin:0 0 20px;color:#9fb3cf}
    #downloadButton{
      display:inline-block;background:linear-gradient(90deg,var(--accent),#06b0ff);
      border:none;color:white;padding:20px 44px;border-radius:12px;font-size:20px;font-weight:700;cursor:pointer;
      box-shadow:0 8px 24px rgba(8,160,255,0.18);transition:transform .12s ease,box-shadow .12s ease;
    }
    #downloadButton:active{transform:translateY(2px)}
    #downloadButton[disabled]{opacity:.6;cursor:default;transform:none}
    .progress{height:12px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden;margin-top:18px}
    .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#06b0ff,#00ffd2);transition:width .1s linear}
    .hint{margin-top:14px;color:#7fa6cf;font-size:13px}
    .small{font-size:13px;color:#7fa6cf;margin-top:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main">
      <h1>Eaglercraft — Resource packs and more</h1>
      <p>Click the button below to download the repository as eag.zip</p>
      <button id="downloadButton">Download</button>

      <div class="progress" aria-hidden="true" style="display:none;">
        <i id="progressBar"></i>
      </div>
      <div class="hint" id="status" aria-live="polite"></div>
      <div class="small">If automatic download is blocked by the browser, you'll be redirected to GitHub to download manually.</div>
    </div>
  </div>

  <script>
    (function(){
      const owner = 'thevette67-YT';
      const repo = 'Eaglercraft-Resource-Packs-and-More';
      const ref = 'main'; // default branch found in repo metadata
      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/zipball/${ref}`;
      const fallbackUrl = `https://github.com/${owner}/${repo}/archive/refs/heads/${ref}.zip`;

      const btn = document.getElementById('downloadButton');
      const status = document.getElementById('status');
      const progWrap = document.querySelector('.progress');
      const progBar = document.getElementById('progressBar');

      function setStatus(text) { status.textContent = text; }
      function setProgress(pct) { progWrap.style.display = ''; progBar.style.width = pct + '%'; }

      async function saveBlob(blob, filename = 'eag.zip') {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      async function downloadViaFetch() {
        setStatus('Starting download...');
        try {
          const response = await fetch(apiUrl);
          if (!response.ok) throw new Error('Network response not OK: ' + response.status);

          // If streaming not supported, fall back to blob() call
          const contentLength = response.headers.get('content-length');
          if (!response.body || !response.body.getReader) {
            setStatus('Saving file...');
            const blob = await response.blob();
            await saveBlob(blob);
            setStatus('Download complete.');
            return;
          }

          const total = contentLength ? parseInt(contentLength, 10) : null;
          const reader = response.body.getReader();
          let received = 0;
          const chunks = [];
          while (true) {
            const {done, value} = await reader.read();
            if (done) break;
            chunks.push(value);
            received += value.byteLength || value.length;
            if (total) {
              setProgress(Math.floor((received / total) * 100));
              setStatus(`Downloading — ${Math.floor((received / total) * 100)}%`);
            } else {
              // show an indeterminate pseudo-progress
              setStatus(`Downloading — ${(Math.round(received/1024/1024*100)/100)} MB received`);
            }
          }
          const blob = new Blob(chunks, { type: 'application/zip' });
          setStatus('Finalizing file...');
          await saveBlob(blob, 'eag.zip');
          setStatus('Download complete.');
        } catch (err) {
          console.error(err);
          throw err;
        }
      }

      btn.addEventListener('click', async () => {
        btn.disabled = true;
        progWrap.style.display = 'none';
        progBar.style.width = '0%';
        setStatus('');
        try {
          // Try to fetch via GitHub API and stream to a blob (so we can name it eag.zip)
          await downloadViaFetch();
        } catch (err) {
          // If fetch or CORS prevented it, fall back to navigating to GitHub's archive (user can manually save)
          setStatus('Automatic download blocked. Redirecting to GitHub archive...');
          // small timeout so the user sees the status
          setTimeout(() => {
            window.location.href = fallbackUrl;
          }, 800);
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
